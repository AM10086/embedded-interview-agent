<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>嵌入式面试 AI Agent · 网页版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","PingFang SC",sans-serif; background:#0f172a; color:#e2e8f0; min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px 60px; }
  header { text-align:center; padding:24px 0 16px; }
  header h1 { font-size:24px; color:#38bdf8; }
  header .sub { color:#94a3b8; font-size:13px; margin-top:6px; }
  .stats { display:flex; justify-content:center; gap:24px; margin:14px 0; flex-wrap:wrap; }
  .stat { background:#1e293b; border:1px solid #334155; border-radius:10px; padding:8px 18px; text-align:center; }
  .stat b { display:block; font-size:20px; color:#38bdf8; }
  .stat span { font-size:12px; color:#94a3b8; }
  .cats { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:16px 0; }
  .chip { background:#1e293b; border:1px solid #334155; color:#cbd5e1; border-radius:999px; padding:6px 14px; font-size:13px; cursor:pointer; }
  .chip.active { background:#0ea5e9; border-color:#0ea5e9; color:#fff; }
  .actions { display:flex; gap:12px; justify-content:center; margin:14px 0 20px; flex-wrap:wrap; }
  .btn { border:none; border-radius:10px; padding:10px 22px; font-size:15px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#0ea5e9; color:#fff; }
  .btn-secondary { background:#334155; color:#e2e8f0; }
  .card { background:#1e293b; border:1px solid #334155; border-radius:14px; padding:22px; }
  .qhead { display:flex; justify-content:space-between; font-size:13px; color:#94a3b8; margin-bottom:10px; }
  .qtext { font-size:16px; line-height:1.7; margin-bottom:16px; }
  .opts { display:flex; flex-direction:column; gap:10px; }
  .opt { background:#0f172a; border:1px solid #334155; border-radius:10px; padding:12px 16px; cursor:pointer; font-size:15px; }
  .opt:hover { border-color:#38bdf8; }
  .opt.correct { border-color:#22c55e; background:#14532d; }
  .opt.wrong { border-color:#ef4444; background:#7f1d1d; }
  .opt.disabled { pointer-events:none; }
  .jbtn { display:flex; gap:14px; justify-content:center; }
  .jbtn button { flex:1; padding:14px; border-radius:10px; font-size:16px; cursor:pointer; border:1px solid #334155; background:#0f172a; color:#e2e8f0; }
  textarea { width:100%; min-height:80px; background:#0f172a; border:1px solid #334155; border-radius:10px; color:#e2e8f0; padding:12px; font-size:14px; font-family:inherit; }
  .grade { display:flex; gap:8px; justify-content:center; margin-top:12px; }
  .grade button { width:44px; height:44px; border-radius:50%; border:1px solid #334155; background:#0f172a; color:#e2e8f0; font-size:15px; cursor:pointer; }
  .grade button.sel { background:#0ea5e9; border-color:#0ea5e9; }
  .feedback { margin-top:14px; padding:12px; border-radius:10px; font-size:14px; line-height:1.7; }
  .feedback.ok { background:#052e16; border:1px solid #22c55e; }
  .feedback.no { background:#450a0a; border:1px solid #ef4444; }
  .next { margin-top:16px; text-align:right; }
  .bar { height:10px; background:#0f172a; border-radius:5px; overflow:hidden; margin-top:4px; }
  .bar > div { height:100%; background:#0ea5e9; }
  .weak { display:flex; flex-direction:column; gap:12px; margin-top:8px; }
  .weak .row { font-size:14px; }
  .weak .row .lbl { display:flex; justify-content:space-between; margin-bottom:2px; }
  .hidden { display:none; }
  footer { text-align:center; color:#475569; font-size:12px; margin-top:30px; }
  a { color:#38bdf8; text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🤖 嵌入式面试 AI Agent</h1>
    <div class="sub">按薄弱点智能出题 · 自动判分 · 讲解 · 网页版</div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="cats" id="cats"></div>

  <div class="actions">
    <button class="btn btn-primary" onclick="startQuiz('practice')">▶ 开始练习（智能出题）</button>
    <button class="btn btn-secondary" onclick="startQuiz('mock')">🎯 面试模拟（10题）</button>
    <button class="btn btn-secondary" onclick="showWeak()">📊 薄弱点分析</button>
  </div>

  <div class="card hidden" id="quizCard">
    <div class="qhead"><span id="qCat"></span><span id="qIdx"></span></div>
    <div class="qtext" id="qText"></div>
    <div class="opts" id="qOpts"></div>
    <div class="jbtn hidden" id="qJudge"></div>
    <div class="hidden" id="qShort">
      <textarea id="shortInput" placeholder="输入你的答案..."></textarea>
      <div class="grade" id="gradeBox"></div>
    </div>
    <div class="feedback hidden" id="feedback"></div>
    <div class="next"><button class="btn btn-primary" id="nextBtn" onclick="next()">下一题 →</button></div>
  </div>

  <div class="card hidden" id="weakCard">
    <h2 style="font-size:17px;margin-bottom:10px;">📊 薄弱点分析（正确率从低到高）</h2>
    <div class="weak" id="weakList"></div>
    <div class="actions"><button class="btn btn-secondary" onclick="backHome()">← 返回</button></div>
  </div>

  <footer>开源项目：<a href="https://github.com/AM10086/embedded-interview-agent" target="_blank">github.com/AM10086/embedded-interview-agent</a></footer>
</div>

<script src="questions.js"></script>
<script>
var QS = window.QUESTIONS || [];
var CATS = [...new Set(QS.map(function(q){return q.category;}))];
var state = { mode:'practice', cat:'all', pool:[], idx:0, score:0, total:0 };
var current = null;

function stats(){ try { return JSON.parse(localStorage.getItem('agent_stats')||'{}'); } catch(e){ return {}; } }
function saveStats(s){ localStorage.setItem('agent_stats', JSON.stringify(s)); }
function record(cat, ok){
  var s = stats();
  s[cat] = s[cat] || {correct:0, total:0};
  s[cat].total++; if(ok) s[cat].correct++;
  saveStats(s);
}
function catWeight(c){
  var s = stats()[c];
  if(!s || !s.total) return 1;
  return 1 + (1 - s.correct/s.total) * 2;
}

function init(){
  var st = document.getElementById('stats');
  st.innerHTML = '<div class="stat"><b>'+QS.length+'</b><span>总题量</span></div>' +
    '<div class="stat"><b>'+CATS.length+'</b><span>知识点分类</span></div>';
  var chips = '<div class="chip active" onclick="setCat(this,\'all\')">全部 ('+QS.length+')</div>';
  CATS.forEach(function(c){
    var n = QS.filter(function(q){return q.category===c;}).length;
    chips += '<div class="chip" onclick="setCat(this,\''+c+'\')">'+c+' ('+n+')</div>';
  });
  document.getElementById('cats').innerHTML = chips;
}

function setCat(el, c){
  document.querySelectorAll('.chip').forEach(function(x){x.classList.remove('active');});
  el.classList.add('active');
  state.cat = c;
  document.getElementById('quizCard').classList.add('hidden');
  document.getElementById('weakCard').classList.add('hidden');
}

function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

function weightedPool(n){
  var pool = state.cat==='all' ? QS.slice() : QS.filter(function(q){return q.category===state.cat;});
  if(!pool.length) return [];
  var hasStats = Object.keys(stats()).length > 0;
  if(state.cat==='all' && hasStats){
    var w = pool.map(function(q){return catWeight(q.category);});
    var totalW = w.reduce(function(a,b){return a+b;},0);
    var res = [];
    for(var i=0;i<Math.min(n,pool.length);i++){
      var r = Math.random()*totalW, acc = 0, pick = pool[0];
      for(var j=0;j<pool.length;j++){ acc += w[j]; if(r<=acc){ pick = pool[j]; break; } }
      res.push(pick);
    }
    return res;
  }
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}

function startQuiz(mode){
  state.mode = mode;
  state.score = 0; state.total = 0;
  state.pool = weightedPool(mode==='mock' ? 10 : 10);
  if(!state.pool.length){ alert('没有题目，请选择分类'); return; }
  document.getElementById('weakCard').classList.add('hidden');
  document.getElementById('quizCard').classList.remove('hidden');
  state.idx = 0;
  showQuestion();
}

function showQuestion(){
  current = state.pool[state.idx];
  document.getElementById('qCat').textContent = '['+current.category+']';
  document.getElementById('qIdx').textContent = (state.idx+1)+' / '+state.pool.length;
  document.getElementById('qText').textContent = current.question;
  document.getElementById('feedback').classList.add('hidden');
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('qShort').classList.add('hidden');
  document.getElementById('qJudge').classList.add('hidden');
  var opts = document.getElementById('qOpts');
  opts.innerHTML = ''; opts.classList.remove('hidden');
  if(current.type === 'single'){
    (current.options||[]).forEach(function(o, i){
      var d = document.createElement('div');
      d.className = 'opt'; d.textContent = o;
      d.onclick = function(){ answer(i); };
      opts.appendChild(d);
    });
  } else if(current.type === 'judge'){
    opts.classList.add('hidden');
    var jb = document.getElementById('qJudge');
    jb.classList.remove('hidden');
    jb.innerHTML = '<button onclick="answer(\'对\')">✓ 对</button><button onclick="answer(\'错\')">✗ 错</button>';
  } else {
    opts.classList.add('hidden');
    var qs = document.getElementById('qShort');
    qs.classList.remove('hidden');
    document.getElementById('shortInput').value = '';
    var gb = document.getElementById('gradeBox');
    gb.innerHTML = '';
    for(var g=1;g<=5;g++){
      (function(v){ var b=document.createElement('button'); b.textContent=v;
        b.onclick=function(){ selfGrade(v,b); }; gb.appendChild(b); })(g);
    }
  }
}

function selfGrade(v, btn){
  document.querySelectorAll('.grade button').forEach(function(b){b.classList.remove('sel');});
  btn.classList.add('sel');
  state.shortGrade = v;
  submitShort();
}

function submitShort(){
  var fb = document.getElementById('feedback');
  fb.classList.remove('hidden','ok','no');
  fb.className = 'feedback ok';
  fb.innerHTML = '<b>[参考答案]</b> ' + (current.answer||'') + '<br><b>[讲解]</b> ' + (current.explanation||'');
  var ok = (state.shortGrade||0) >= 4;
  record(current.category, ok);
  state.total++; if(ok) state.score++;
  document.getElementById('nextBtn').style.display = 'block';
  if(state.idx+1 >= state.pool.length) document.getElementById('nextBtn').textContent = '查看结果 🏁';
}

function answer(i){
  var correct = false;
  if(current.type === 'single'){
    var letter = String.fromCharCode(65 + i);
    correct = letter === current.answer;
    var optDivs = document.querySelectorAll('#qOpts .opt');
    optDivs.forEach(function(d, idx){
      d.classList.add('disabled');
      var L = String.fromCharCode(65+idx);
      if(L === current.answer) d.classList.add('correct');
      else if(idx === i) d.classList.add('wrong');
    });
  } else if(current.type === 'judge'){
    correct = String(i).toUpperCase() === String(current.answer).toUpperCase();
    document.querySelectorAll('#qJudge button').forEach(function(b){b.disabled = true;});
  }
  var fb = document.getElementById('feedback');
  fb.classList.remove('hidden','ok','no');
  if(correct){ fb.className = 'feedback ok'; fb.innerHTML = '<b>[正确]</b> '+(current.explanation||''); }
  else { fb.className = 'feedback no'; fb.innerHTML = '<b>[错误] 正确答案：'+(current.answer||'')+'</b><br>'+(current.explanation||''); }
  record(current.category, correct);
  state.total++; if(correct) state.score++;
  document.getElementById('nextBtn').style.display = 'block';
  if(state.idx+1 >= state.pool.length) document.getElementById('nextBtn').textContent = '查看结果 🏁';
}

function next(){
  state.idx++;
  if(state.idx >= state.pool.length){
    var pct = Math.round(state.score/state.total*100);
    var fb = document.getElementById('feedback');
    fb.classList.remove('hidden'); fb.className = 'feedback ok';
    fb.innerHTML = '<b>本轮完成！得分 '+state.score+' / '+state.total+'（'+pct+'%）</b><br>点击下方"薄弱点分析"查看你的知识短板。';
    document.getElementById('nextBtn').style.display = 'none';
    document.getElementById('qOpts').innerHTML = '';
    document.getElementById('qJudge').classList.add('hidden');
    document.getElementById('qShort').classList.add('hidden');
    return;
  }
  showQuestion();
}

function showWeak(){
  document.getElementById('quizCard').classList.add('hidden');
  var wc = document.getElementById('weakCard');
  wc.classList.remove('hidden');
  var rows = [];
  var s = stats();
  for(var c in s){ if(s[c].total>0) rows.push({c:c, rate:s[c].correct/s[c].total}); }
  rows.sort(function(a,b){ return a.rate - b.rate; });
  var html = '';
  if(!rows.length){ html = '<div style="color:#94a3b8">还没有答题记录，先去练几题吧！</div>'; }
  rows.forEach(function(r){
    var pct = Math.round(r.rate*100);
    html += '<div class="row"><div class="lbl"><span>'+r.c+'</span><span>'+pct+'%</span></div>' +
      '<div class="bar"><div style="width:'+pct+'%"></div></div></div>';
  });
  document.getElementById('weakList').innerHTML = html;
}

function backHome(){
  document.getElementById('weakCard').classList.add('hidden');
  document.getElementById('quizCard').classList.add('hidden');
}

init();
</script>
</body>
</html>
